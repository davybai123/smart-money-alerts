[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://goaledge.io", "https://www.goaledge.io"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.calculate-ev]
verify_jwt = false

[functions.match-analysis]
verify_jwt = false

[functions.run-tournament-simulation]
verify_jwt = false

[functions.generate-predictions]
verify_jwt = true

[functions.ingest-odds]
verify_jwt = true

[functions.ingest-results]
verify_jwt = true

[functions.refresh-value-bets]
verify_jwt = true

[functions.generate-narrative]
verify_jwt = true

[analytics]
enabled = false
