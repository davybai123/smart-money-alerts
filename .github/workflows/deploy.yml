name: Deploy FacelessYT

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PT-App/package-lock.json

      - name: Build Dashboard
        working-directory: PT-App
        run: |
          npm ci
          npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build Engine
        working-directory: engine
        run: |
          npm ci
          npm run build

      - name: Build Docker images
        run: |
          docker compose build

      - name: Deploy to Railway (or VPS)
        run: |
          echo "Add your deployment command here"
          echo "e.g.: railway up or rsync + docker compose up -d"
